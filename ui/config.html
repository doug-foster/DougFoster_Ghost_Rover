 <!DOCTYPE html>
<!--
 * *************************************************************************
 *  Ghost Rover 3 - UI HTML.
 * *************************************************************************
 *
 * config.html
 *
 * @author D. Foster <doug@dougfoster.me>.
 * @since  3.0.3  [2025-10-20-10:45am].
 * @since  3.0.12 [2026-01-31-01:30pm] UI tweaks.
 * @since  3.0.12 [2026-02-08-06:30pm] Removed prfRqsPvtInt.
 * @since  3.0.12 [2026-02-21-12:00am] Add unit & build to header.
 * @since  3.1.0  [2026-03-02-05:00pm] Stable 3.0 version.
 * @since  3.1.0  [2026-03-07-04:45pm] Instrument height.
 * @since  3.1.0  [2026-03-18-06:00pm] Run time options.
 * @since  3.1.0  [2026-03-20-12:00pm] Pole heights.
 * @since  3.1.1  [2026-06-25-02:00pm] Regroup: upload to SD card.
 * @since  3.1.1  [2026-06-26-10:00pm] Hand grip w/tripod.
 * @since  3.1.1  [2026-06-29-02:00pm] GhostRover -> GhostRover + QR.
 * @since  3.1.2  [2026-07-05-08:30pm] General cleanup.
 * @since  3.1.2  [2026-07-07-01:00pm] Instrument height always in mm.
 * @since  3.1.2  [2026-07-14-09:45am] Add NTRIP.
 * @link   http://dougfoster.me.
-->

<html>
    <!---- Head. ---->
    <head>
        <title>config</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" type="text/css" href="global.css">
        <link rel="stylesheet" type="text/css" href="config.css">
        <script src="global.js" defer></script>
        <script src="config.js" defer></script>
    </head>
    <body>
        <!---- Header. ---->
        <header>
            <a class="new-page" href="menu.html">
                <h1 class="red">Config</h1>
                <div id="header-items"><div id="unit-display"></div><div id="version-rover"></div></div>
            </a>
        </header>

        <!---- Config. ---->
        <form id="config">
            <section class="grid-container collapsed">

                <div class="config-section config-grid-buttons" id="system-options">  <!--- Button switches. --->
                    <div class="group-label full-row section-heading">System options</div>
                    <div class="grid-item">Units</div>
                    <div id="set-unit" class="switch-field grid-item">
                        <input type="radio" id="unit-meter" name="switch-unit" value="meter" />
                        <label for="unit-meter">Meter</label>
                        <input type="radio" id="unit-feet" name="switch-unit" value="feet"/>
                        <label for="unit-feet">Feet</label>
                    </div>
                    <div class="grid-item">RTCM in</div>
                    <div id="set-rtcm-in" class="switch-field grid-item">
                        <input type="radio" id="rtcm-in-off" name="switch-rtcm-in" value="off" />
                        <label for="rtcm-in-off">Off</label>
                        <input type="radio" id="rtcm-in-radio" name="switch-rtcm-in" value="radio" />
                        <label for="rtcm-in-radio">Radio</label>
                        <input type="radio" id="rtcm-in-ntrip" name="switch-rtcm-in" value="ntrip" />
                        <label for="rtcm-in-ntrip">NTRIP</label>
                    </div>
                    <div class="grid-item">NMEA BT out</div>
                    <div class="switch-field grid-item">
                        <input type="radio" id="nmea-off" name="switch-nmea-out" value="off" />
                        <label for="nmea-off">Off</label>
                        <input type="radio" id="nmea-on" name="switch-nmea-out" value="on"/>
                        <label for="nmea-on">On</label>
                    </div>
                </div>

                <div class="config-section config-grid-fields field-group" id="instrument-heights">  <!--- Instrument height. --->
                    <div class="group-label full-row section-heading">Instrument height</div>
                    <div>GhostRover + QR (<span id="height-units">--</span>)</div>
                    <div id="ghostrover-height"></div>
                    <select id="pole-select">
                        <option id="manual" value=0>Manual</option>
                        <option id="grip" value=0>Hand grip w/tripod</option>
                        <option id="xyzPole-0" value=0>XYZ pole no extn</option>
                        <option id="xyzPole-1" value=0>XYZ pole 1 extn </option>
                        <option id="xyzPole-2" value=0>XYZ pole 1,2 extn</option>
                        <option id="xyzPole-3" value=0>XYZ pole 1-3 extn</option>
                    </select>
                    <div id="pole-height-preset"></div>
                    <input id="pole-height" type="text"/>
                    <!-- <div id="pole-height-preset" class="hide"></div> -->
                    <div class="vcenter">Instrument height<sup>*</sup> (mm/in)</div>
                    <div id="instrument-height"><span id="instrument-height-mm"></span> / <span id="instrument-height-in"></span></div>
                    <div class="note"><sup>*</sup>Always saved as millimeters.</div>
                </div>

                <div class="config-section config-grid-fields field-group" id="generate-pvt">  <!--- GNSS measure interval & nav rate. --->
                    <!-- @see gnss.setMeasurementRate(100); -->
                    <div class="group-label full-row section-heading">Generate PVT</div>
                    <label for="gnss-measure-interval">Measure every (ms) *</label>
                    <select id="gnss-measure-interval">
                        <option value="1000">1000 (1 Hz)</option>
                        <option value="900">900</option>
                        <option value="800">800</option>
                        <option value="700">700</option>
                        <option value="600">600</option>
                        <option value="500">500 (2 Hz)</option>
                        <option value="400">400</option>
                        <option value="300">300</option>
                        <option value="200">200 (5 Hz)</option>
                        <option value="100">100 (10 Hz)</option>
                        <option value="50">50 (20 Hz)</option>
                    </select>
                    <!-- @see gnss.setNavigationRate(1); -->
                    <label for="gnss-nav-rate">Navigation rate *</label>
                    <select id="gnss-nav-rate">
                        <option value="1">1 Hz</option>
                        <option value="2">2 Hz</option>
                        <option value="3">3 Hz</option> 
                        <option value="4">4 Hz</option>
                        <option value="5">5 Hz</option>
                        <option value="6">6 Hz</option>
                        <option value="7">7 Hz</option>
                        <option value="8">8 Hz</option>
                        <option value="9">9 Hz</option>
                        <option value="10">10 Hz</option>
                    </select>
                    <div id="message-output-interval" class="note">* Output PVT every <span id="output-interval"></span> ms.</div>
                </div>

                <div class="config-section config-grid-fields field-group" id="wifi-hot-spot">  <!--- WiFi hotspot credentials. --->
                    <div class="group-label full-row section-heading">WiFi</div>
                    <label for="hotspot-ssid">SSID *</label>
                    <input type="text" id="hotspot-ssid" />
                    <label for="hotspot-password">Password</label>
                    <input type="text" id="hotspot-password"/>
                    <div class="note">* Connect as WIFI client.</div>
                </div>

                <div class="config-section config-grid-fields field-group" id="ntrip">  <!--- NTRIP. --->
                    <div class="group-label full-row section-heading">NTRIP (RTCM in)</div>
                    <label for="ntrip-caster-active">Using caster ...</label>
                    <select id="ntrip-caster-active">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <label for="ntrip-caster">Attributes for caster</label>
                    <select id="ntrip-caster">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <label for="ntrip-name">Name</label>
                    <input id="ntrip-name"  class="attribute" type="text" />

                    <label for="ntrip-url">URL</label>
                    <input id="ntrip-url" class="attribute" type="text"/>

                    <label for="ntrip-mount">Mount point</label>
                    <input id="ntrip-mount" class="attribute" type="text"/>

                    <label for="ntrip-port">Port</label>
                    <input id="ntrip-port" class="attribute" type="text"/>

                    <label for="ntrip-version">Version</label>
                    <select id="ntrip-version" class="attribute">
                        <option value="1">V 1</option>
                        <option value="2">V 2</option>
                    </select>

                    <label for="ntrip-user">User name</label>
                    <input id="ntrip-user" class="attribute" type="text"/>

                    <label for="ntrip-password">Password</label>
                    <input id="ntrip-password" class="attribute" type="text"/>

                    <span id="ntrip-send-gga">Send GGA</span>
                    <label class="checkbox-container" id="ntrip-send-gga"><span></span>
                        <input class="attribute" type="checkbox">
                        <span class="checkmark"></span>
                    </label>
                     <div id="ntrip-update-attributes" class="std-button">
                        <span class="label">Save caster <span id="ntrip-caster-dup"></span> attributes</span>
                     </div>
                </div>
               
                <div id="update-config-btn" class="std-button">
                    <span class="label">Update config</span>
                </div>

                <div id="reset-config-btn" class="std-button">
                    <span class="label">Reset to Defaults</span>
                </div>

                <div id="message-form" class="note">&nbsp;</div>  
            </section>
        </form>
        <div id="runtime-options">
            <label class="checkbox-container" id="js-console-messages"><span>Display WebSocket global console messages.</span>
                <input type="checkbox">
                <span class="checkmark"></span>
            </label>
        </div>
    </body>
</html>
