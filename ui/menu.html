<html>

    <!---- Head. ---->
    <head>
        <title>menu</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" type="text/css" href="global.css">
        <link rel="stylesheet" type="text/css" href="menu.css">
        <script src="global.js" defer></script>
        <script src="menu.js" defer></script>
    </head>

    <body>

        <!---- Header. ---->
        <header>
            <a href="menu.html">
                <h1 class="red">Menu</h1>
                <div id="header-items">
                    <div id="version-rover">x.x.x ...</div>
                </div>
            </a>
        </header>

        <!---- Menu. ---->
        <section id="menu-items">

            <!--- Menu buttons. --->
            <div class="button-group">
                <a id="operation" class="std-button" href="instructions.html">
                    <span class="label">Instructions</span>
                </a>
                <a id="wiring" class="std-button" href="wiring.html">
                    <span class="label">Wiring</span>
                </a>
                <a id="internet" class="std-button">
                    <span class="label">Internet</span>
                    <div class="state"></div>
                </a>
                <a id="ntrip-caster" class="std-button">
                    <span class="label">NTRIP</span>
                    <div class="state"></div>
                </a>
                <a id="config" class="std-button" href="config.html">
                    <span class="label">Config</span>
                </a>
                <a id="files" class="std-button" href="files.html">
                    <span class="label">Files</span>
                </a>
                <a id="operate" class="std-button" href="operate.html">
                    <span class="label">Operate</span>
                </a>
                <a id="restart" class="std-button">
                    <span class="label">Restart</span>
                </a>
                <a id="debug" class="std-button" href="debug.html">
                    <span class="label">Debug</span>
                </a>
                <a id="nmea" class="std-button" href="nmea.html">
                    <span class="label">NMEA</span>
                </a>
            </div>

            <!--- Messages. --->
            <div id="message-field" class="note hide">&nbsp;</div>
            <div id="rtcm-status" class="note hide"><span id="rtcm-sentence-count">0</span><span> RTCM sentences received.</span></div>
        </section>

    </body>
</html>
